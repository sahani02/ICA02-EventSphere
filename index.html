<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EventSphere</title><style>
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;color:#19243a;background:#f1f5fa}header{background:#2fcaca;color:white;padding:18px 5%;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}header strong{font-size:23px}main{max-width:1100px;margin:auto;padding:20px 14px}h1,h2,h3{line-height:1.2}h2{margin-top:28px}section,.card{background:white;border:1px solid #dbe2ec;border-radius:12px;padding:16px;margin:12px 0;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}.grid .card{margin:0}label{display:block;font-weight:600;margin:8px 0}input,select,textarea,button{font:inherit;border-radius:7px;padding:10px;margin:4px 0;max-width:100%}input,select,textarea{width:100%;border:1px solid #b9c7d5}button{border:0;background:#126665;color:white;cursor:pointer;font-weight:650}button.secondary{background:#435672}button.danger{background:#a33d37}button:hover{opacity:.85}small,.muted{color:#586981}.tag{background:#e6f3f3;padding:3px 8px;border-radius:10px}#notice{position:sticky;top:0;z-index:5;display:none;background:#fff5d1;border:1px solid #e2b965;padding:12px;border-radius:8px;white-space:pre-wrap}pre{white-space:pre-wrap;word-break:break-all;font-size:12px}.qr{width:150px;max-width:100%;display:block}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row input{flex:1;min-width:100px}.row button{flex-shrink:0}details{margin:8px 0}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid #e0e6ed}.scroll{overflow-x:auto}a{color:#146765}footer{padding:20px;text-align:center;color:#64748b}#reader{max-width:400px}img.venue{width:100%;height:125px;object-fit:cover;border-radius:8px}
</style></head><body><header><strong>EventSphere</strong><div id="identity">Guest</div><button id="logout" class="secondary" hidden>Sign out</button></header><main><div id="notice" role="status"></div><div id="app"></div></main><footer>University events • Simulated payments only</footer><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script>
let csrf='',user=null,venues=[],events=[],dashboard=null,scanner=null;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=s=>new Date(s).toLocaleString();const money=n=>'LKR '+Number(n).toLocaleString();const localDate=hours=>{let d=new Date(Date.now()+hours*3600000);return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,16)};
function notify(msg){$('notice').textContent=typeof msg==='string'?msg:JSON.stringify(msg,null,2);$('notice').style.display='block';window.scrollTo({top:0,behavior:'smooth'});}
async function api(path,data,method='POST'){const opts=data===undefined?{}:{method,headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(data)};const r=await fetch('/api'+path,opts);let j=await r.json();if(!r.ok)throw Error(typeof j.detail==='string'?j.detail:JSON.stringify(j.detail));return j;}
async function action(path,data,method='POST'){try{let j=await api(path,data,method);if(j.performative==='PROPOSE'){notify(j.reason+'\n'+j.alternatives.map(a=>a.venue+' | '+fmt(a.start)+' – '+fmt(a.end)+' | '+money(a.price)).join('\n'));return;}notify(j.reason||j.performative==='REFUSE'?' '+(j.reason||'Refused'):'Success'+(j.refund!==undefined?' • Refund '+money(j.refund):'')+(j.price!==undefined?' • '+j.status+' • '+money(j.price):''));if(j.performative!=='REFUSE')await refresh();}catch(e){notify(e.message)}}
function form(id,handler){$(id).onsubmit=async e=>{e.preventDefault();try{await handler(Object.fromEntries(new FormData(e.target)))}catch(e){notify(e.message)}}}
function options(items,field='name'){return items.map(x=>`<option value="${x.id}">${esc(x[field])}</option>`).join('')}
function authHTML(){return `<h1>Find your next event</h1><section><h2>Sign in or register</h2><form id="login"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="8" required></label><button>Sign in</button> <button type="button" class="secondary" id="register">Register attendee</button></form><small>Use the demo credentials provided in your report.</small></section>`}
async function refresh(){if(scanner){try{await scanner.clear()}catch{}scanner=null;}const s=await api('/session');csrf=s.csrf;user=s.user;venues=await api('/venues');events=await api('/events');$('identity').textContent=user?user.email+' • '+user.role:'Guest';$('logout').hidden=!user;let a=$('app');if(!user){a.innerHTML=authHTML()+browseHTML();form('login',async d=>{await api('/login',d);await refresh()});$('register').onclick=async()=>{try{await api('/register',Object.fromEntries(new FormData($('login'))));await refresh()}catch(e){notify(e.message)}};bindBrowse();return}if(user.role==='admin'){dashboard=await api('/admin/dashboard');a.innerHTML=adminHTML();bindAdmin();}else if(user.role==='staff'){a.innerHTML=staffHTML();bindStaff();}else{let data=await api('/me');a.innerHTML=browseHTML()+attendeeHTML(data);bindBrowse();bindAttendee();}}
function browseHTML(){return `<h1>Discover events</h1><form id="filter" class="row"><input name="q" placeholder="Search events"><input name="category" placeholder="Category (e.g. Workshop)"><button>Search</button></form><div class="grid" id="events">${cards(events)}</div>`}
function cards(list){return list.map(e=>`<article class="card">${/^https?:\/\//i.test(e.image||'')?`<img class="venue" src="${esc(e.image)}" alt="Venue">`:''}<span class="tag">${esc(e.category)}</span><h2>${esc(e.title)}</h2><p>${esc(e.venue)} · ${esc(fmt(e.start))}</p><p>${esc(e.description)}</p>${e.categories.map(c=>`<div><b>${esc(c.name)}</b> · ${money(c.price)} · ${c.quantity-c.sold-c.held} left ${user?.role==='attendee'?`<div class="row"><input id="qty${c.id}" type="number" min="1" max="6" value="1" aria-label="Ticket quantity"><button onclick="buy(${c.id},false)">Book</button><button class="secondary" onclick="buy(${c.id},true)">Waitlist</button></div>`:''}</div>`).join('')}</article>`).join('')||'<p>No events found.</p>'}
function bindBrowse(){form('filter',async d=>{$('events').innerHTML=cards(await api('/events?'+new URLSearchParams(d)))})}function buy(id,wait){action(wait?'/waitlist':'/book',{category_id:id,quantity:Number($('qty'+id).value)})}
function attendeeHTML(d){return `<h2>My bookings</h2><div class="grid">${d.bookings.map(b=>`<article class="card"><h3>${esc(b.title)}</h3><p>${b.quantity} tickets • ${money(b.total)} • ${esc(b.status)}</p><small>Payment: ${esc(b.payment_ref)} · Refund: ${money(b.refund)}</small>${b.tickets.map(t=>`<details><summary>Ticket #${t.id} · ${esc(t.status)}</summary><img class="qr" src="${t.qr}" alt="Ticket QR"><small>${esc(t.code)}</small></details>`).join('')}${b.status==='confirmed'?`<button class="danger" onclick="action('/bookings/${b.id}/cancel',{})">Cancel booking</button>`:''}</article>`).join('')||'<p>No bookings yet.</p>'}</div><h2>Waitlist</h2><section>${d.waitlist.map(w=>`<p>#${w.id} · ${w.quantity} tickets · ${esc(w.status)} ${w.status==='offered'?`<span data-expiry="${esc(w.expires)}"></span> <button onclick="action('/waitlist/${w.id}/claim',{})">Claim offer</button>`:''}</p>`).join('')||'No waitlist entries.'}</section><h2>Private venue hire</h2><section><form id="hire"><label>Venue<select name="venue_id">${options(venues)}</select></label><label>Start<input type="datetime-local" name="start" value="${localDate(24)}" required></label><label>End<input type="datetime-local" name="end" value="${localDate(26)}" required></label><label>Purpose<input name="purpose" required></label><label>Guest count<input type="number" min="1" name="guests" value="20" required></label><button>Request hire</button></form>${d.hires.map(h=>`<p>Hire #${h.id}: ${esc(h.status)} · ${money(h.price)} · ${esc(fmt(h.start))}</p>`).join('')}</section><h2>Notifications</h2><section>${d.notifications.slice().reverse().map(n=>`<p>${esc(n.text)} <small>${esc(fmt(n.created))}</small></p>`).join('')||'No notifications.'}</section>`}
function bindAttendee(){form('hire',d=>action('/hires',{...d,venue_id:+d.venue_id,guests:+d.guests,start:new Date(d.start).toISOString(),end:new Date(d.end).toISOString()}))}
function adminHTML(){return `<h1>Organiser dashboard</h1><div class="grid">${dashboard.events.map(e=>`<article class="card"><h3>${esc(e.title)}</h3><span class="tag">${esc(e.status)}</span><p>${e.sold} sold / ${e.capacity} venue capacity</p><p>${money(e.revenue)} net simulated revenue · ${e.checkins} check-ins</p>${e.status==='draft'?`<button onclick="action('/admin/events/${e.id}/publish',{})">Publish</button>`:e.status==='published'?`<button class="danger" onclick="action('/admin/events/${e.id}/cancel',{})">Cancel event</button>`:''}</article>`).join('')}</div><h2>Venue management</h2><section><form id="venue"><label>Edit existing or create<select name="id" id="venueEdit"><option value="">Create new venue</option>${options(venues)}</select></label><label>Name<input name="name" required></label><label>Location<input name="location" required></label><label>Capacity<input name="capacity" type="number" min="1" required></label><label>Hourly hire rate (LKR)<input name="rate" type="number" min="0" required></label><label>Description<textarea name="description"></textarea></label><label>Image URL<input name="image" type="url"></label><label>Open for private hire<select name="hire_open"><option value="true">Yes</option><option value="false">No</option></select></label><button>Save venue</button></form></section><h2>Event management</h2><section><form id="event"><label>Title<input name="title" required></label><label>Category<input name="category" value="Workshop" required></label><label>Venue<select name="venue_id">${options(venues)}</select></label><label>Start<input type="datetime-local" name="start" value="${localDate(24)}" required></label><label>End<input type="datetime-local" name="end" value="${localDate(26)}" required></label><label>Description<textarea name="description"></textarea></label><label>Ticket categories (name,price,quantity; one per line)<textarea name="categories" required>General,1000,20\nVIP,2500,5</textarea></label><label>Status<select name="status"><option value="draft">Draft</option><option value="published">Publish</option></select></label><button>Save event</button></form></section><h2>Private hire requests</h2><section>${dashboard.hires.map(h=>`<p>#${h.id} · ${esc(h.purpose)} · ${h.guests} guests · ${money(h.price)} · ${esc(h.status)} ${h.status==='pending'?`<button onclick="action('/admin/hires/${h.id}',{approve:true})">Approve</button> <button class="danger" onclick="action('/admin/hires/${h.id}',{approve:false})">Reject</button>`:''}</p>`).join('')||'No requests.'}</section><h2>Agent message trace</h2><section><button onclick="refresh()">Refresh dashboard</button><div class="scroll"><table><thead><tr><th>Sender → receiver</th><th>Performative</th><th>Conversation ID</th><th>Content</th></tr></thead><tbody>${dashboard.messages.slice().reverse().map(m=>`<tr><td>${esc(m.sender)} → ${esc(m.receiver)}</td><td>${esc(m.performative)}</td><td><small>${esc(m.conversation_id)}</small></td><td><pre>${esc(m.content)}</pre></td></tr>`).join('')}</tbody></table></div></section>`}
function bindAdmin(){const v=$('venue');$('venueEdit').onchange=()=>{let item=venues.find(x=>x.id==$('venueEdit').value);if(item)for(let k of ['name','location','capacity','rate','description','image','hire_open'])v.elements[k].value=String(item[k]);else v.reset()};form('venue',d=>{let id=d.id;delete d.id;return action('/admin/venues'+(id?'/'+id:''),{...d,capacity:+d.capacity,rate:+d.rate,hire_open:d.hire_open==='true'},id?'PUT':'POST')});form('event',d=>action('/admin/events',{...d,venue_id:+d.venue_id,start:new Date(d.start).toISOString(),end:new Date(d.end).toISOString(),categories:d.categories.split('\n').filter(Boolean).map(l=>{let [name,price,quantity]=l.split(',');return {name,price:+price,quantity:+quantity}})}))}
function staffHTML(){return `<h1>Gate check-in</h1><section><form id="scan"><label>Event<select name="event_id" id="scanEvent">${options(events,'title')}</select></label><label>Ticket code<input name="code" id="scanCode" required></label><button>Validate ticket</button></form><button class="secondary" id="camera">Start camera scanner</button><div id="reader"></div><h3 id="scanResult" aria-live="polite"></h3></section>`}
async function scanCode(code){try{let r=await api('/staff/scan',{event_id:+$('scanEvent').value,code});$('scanResult').textContent=r.performative+' — '+r.reason;$('scanResult').style.color=r.performative==='AGREE'?'#126665':'#a33d37';$('scanCode').value='';}catch(e){notify(e.message)}}function bindStaff(){form('scan',d=>scanCode(d.code));$('camera').onclick=()=>{try{if(scanner)return;scanner=new Html5QrcodeScanner('reader',{fps:10,qrbox:{width:220,height:220}},false);let last='',time=0;scanner.render(code=>{if(code!==last||Date.now()-time>3000){last=code;time=Date.now();scanCode(code)}},()=>{})}catch(e){notify('Camera unavailable; use manual code entry. '+e.message)}}}
$('logout').onclick=async()=>{await api('/logout',{});await refresh()};setInterval(()=>document.querySelectorAll('[data-expiry]').forEach(el=>{let s=Math.max(0,Math.floor((new Date(el.dataset.expiry)-Date.now())/1000));el.textContent=s?`${Math.floor(s/60)}m ${s%60}s left`:'Expired — refresh'}),1000);refresh().catch(e=>notify(e.message));
</script></body></html>
